[project]
name = "kalkan-data"
version = "0.1.0"
description = "Kalkan veri bilimi: ETL, anonimleştirme, dashboard, erken uyarı ve veri seti"
requires-python = ">=3.12"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S"]
ignore = ["S101"]

[tool.ruff.lint.per-file-ignores]
"*.ipynb" = ["E501", "F401"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["service", "."]

[tool.mypy]
python_version = "3.12"
strict = true

[tool.ruff.lint.isort]
known-first-party = ["app"]
